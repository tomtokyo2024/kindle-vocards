<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词卡记忆</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #000000;
    font-family: -apple-system, "Hiragino Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  body {
    padding-top: 44px;
    padding-bottom: 30px;
  }

  /* ---- 顶部导航栏 ---- */
  #topBar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 44px;
    background: #ffffff;
    z-index: 100;
  }

  #menuBtn {
    position: absolute;
    top: 0;
    left: 12px;
    height: 44px;
    width: 44px;
    background: #ffffff;
    border: none;
    font-size: 21px;
    line-height: 44px;
    padding: 0;
    text-align: center;
  }

  #categoryTitle {
    display: block;
    width: 100%;
    text-align: center;
    line-height: 44px;
    font-size: 13.5px;
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 68px;
  }

  /* ---- 侧边类目面板 ---- */
  #clickCatcher {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    z-index: 290;
  }

  #sidePanel {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 65%;
    height: 100%;
    background: #ffffff;
    border-right: 1px solid #000000;
    z-index: 300;
    overflow-y: auto;
    padding-top: 56px;
  }

  #closePanelBtn {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 48px;
    height: 48px;
    font-size: 36px;
    line-height: 48px;
    text-align: center;
    padding: 0;
    background: #ffffff;
    border: none;
  }

  .panel-item {
    display: block;
    width: 100%;
    padding: 14px 18px;
    text-align: left;
    background: #ffffff;
    border: none;
    border-bottom: 1px solid #cccccc;
    font-size: 24px;
    color: #000000;
  }

  .panel-notebook-entry {
    text-decoration: underline;
    font-weight: bold;
  }

  /* ---- 词卡内容区 ---- */
  #cardArea {
    width: 90%;
    margin: 0 auto;
    padding: 4px 0;
  }

  #progressLabel {
    text-align: center;
    font-size: 18px;
    color: #000000;
    margin: 2px 0 4px 0;
  }

  #statusMsg {
    text-align: center;
    font-size: 19.5px;
    color: #000000;
    min-height: 9px;
    margin-bottom: 3px;
  }

  /* 前へ/次へ 挂在单词这一行的左右两侧,不用单独占一条栏,且随卡片内容一起滚动(不依赖 position:fixed) */
  .word-row {
    position: relative;
    width: 100%;
    overflow: visible;
    margin: 2px 0 2px 0;
  }

  .word-row::after {
    content: "";
    display: table;
    clear: both;
  }

  .nav-btn-inline {
    margin-top: 10px;
    padding: 8px 14px;
    font-size: 22px;
    background: #ffffff;
    color: #000000;
    border: 1px solid #000000;
  }

  #prevBtnTop { float: left; }
  #nextBtnTop { float: right; }

  /* 汉字和假名读音放在同一行,减少纵向占用空间。
     用 text-align:center + inline-block 而不是 flex,老版 Kindle 浏览器对 flex 居中支持不可靠。 */
  .word-line {
    text-align: center;
  }

  .word-main {
    display: inline-block;
    vertical-align: baseline;
    font-size: 57px;
    font-weight: bold;
    word-wrap: break-word;
  }

  /* 假名读音的定位容器,+按钮以它的右上角为锚点 */
  .word-kana-wrap {
    position: relative;
    display: inline-block;
    vertical-align: baseline;
    margin-left: 14px;
  }

  .word-kana-inline {
    font-size: 32px;
    color: #000000;
  }

  /* 添加/移除按钮:黑底白字圆形,贴在假名读音右上角外侧,留出间距不遮挡文字。
     圆形比上一版缩小约30%,但加号字号相对更大更醒目。 */
  .corner-action-btn {
    position: absolute;
    top: -10px;
    right: -46px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #000000;
    color: #ffffff;
    font-size: 24px;
    line-height: 36px;
    border: none;
    padding: 0;
    text-align: center;
  }

  .word-pos {
    text-align: center;
    font-size: 21px;
    color: #000000;
    font-style: italic;
    margin-bottom: 4px;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: #000000;
    margin: 12px 0;
  }

  .field-block {
    text-align: center;
    margin: 12px 0;
  }

  .field-label {
    display: block;
    font-size: 18px;
    color: #000000;
    margin-bottom: 4px;
  }

  .field-value {
    display: block;
    font-size: 25.2px;
    color: #000000;
    line-height: 1.6;
  }

  .empty-state, .loading-state {
    text-align: center;
    color: #000000;
    padding: 70px 0;
    font-size: 22.5px;
  }

  /* ---- 底部控制栏 ----
     Kindle 老浏览器实测 position:fixed 在滚动时不会吸住(会跟着内容一起滑走),
     与其伪装成吸底、行为却不可靠,不如老老实实放在文档正常流里,跟着卡片内容一起滚动,位置可预期。 */
  #bottomBar {
    width: 100%;
    background: #ffffff;
    border-top: 1px solid #000000;
    padding: 8px 0;
    margin-top: 20px;
  }

  .bottom-row {
    width: 100%;
    text-align: center;
    padding: 6px 0;
  }

  .bottom-row button {
    display: inline-block;
    margin: 4px 6px;
    padding: 10px 16px;
    font-size: 22.5px;
    background: #ffffff;
    color: #000000;
    border: 1px solid #000000;
  }

  .bottom-row button:disabled {
    color: #000000;
    border-color: #aaaaaa;
  }

  /* 自动播放进行中:反色为黑底白字,提示当前处于播放状态 */
  #playBtn.active {
    background: #000000 !important;
    color: #ffffff !important;
    border-color: #000000 !important;
  }

  #intervalInput {
    width: 90px;
    padding: 8px 4px;
    font-size: 22.5px;
    border: 1px solid #000000;
    text-align: center;
    margin: 4px 4px;
    vertical-align: middle;
  }

  .interval-label {
    font-size: 19.5px;
    color: #000000;
    margin: 0 2px;
  }

  /* ---- 黑屏硬切换 ---- */
  #blackout {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    z-index: 9999;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="topBar">
  <button id="menuBtn" onclick="openPanel()">&#9776;</button>
  <span id="categoryTitle"></span>
</div>

<div id="clickCatcher" onclick="closePanel()"></div>
<div id="sidePanel">
  <button id="closePanelBtn" onclick="closePanel()">&times;</button>
  <div id="panelList"></div>
</div>

<div id="blackout"></div>

<div id="cardArea">
  <div id="progressLabel"></div>
  <div id="statusMsg"></div>
  <div id="contentWrap"></div>
</div>

<div id="bottomBar">
  <div class="bottom-row">
    <button onclick="handleShuffle()">乱序</button>
    <span class="interval-label">间隔(秒)</span>
    <input type="number" id="intervalInput" value="5" min="1" step="1">
    <button id="playBtn" onclick="startAutoPlay()">自动播放</button>
    <button id="pauseBtn" onclick="pauseAutoPlay()" disabled>暂停</button>
  </div>
</div>

<script>

  // ==== 配置区:生词本云端读写 ====
  var NOTEBOOK_WRITE_URL = "https://script.google.com/macros/s/AKfycbyGL9tXO1WBigSsMkplydjTG77r2s3VvmXL0hntnFnObSPhC-G7I57rw3Fo-uA9zOblrg/exec";
  // 读取改用 gviz/tq 接口(而不是"发布到网络"的 2PACX 链接):
  // 后者会先返回一个 Content-Type: application/binary 的 307 跳转,Kindle 老版浏览器的 XHR 处理不了这个跳转直接报错;
  // gviz/tq 是单次 200 + text/csv,没有这层跳转,Kindle 实测可用。使用这个接口要求表格共享权限开启"知道链接的任何人-查看者"。
  var NOTEBOOK_SHEET_ID = "1Cs3VzifCQzwrglVBGhSxTmLin2gWVFPiTbMawNv1D_0";
  var NOTEBOOK_READ_CSV_URL = "https://docs.google.com/spreadsheets/d/" + NOTEBOOK_SHEET_ID + "/gviz/tq?tqx=out:csv&gid=0";
  var NOTEBOOK_SECRET = "vocab2026xyz"; // 我会自己手动替换成真实密钥,不要改动这行的位置,方便我查找替换

  var PENDING_QUEUE_KEY = "vocab_pending_sync";

  // ==== JSONP 工具函数 ====
  // Apps Script 的 exec URL 对 GET/POST 请求都会先返回一个跳到 script.googleusercontent.com 的
  // 302 跳转,Kindle 老版浏览器的 XHR 处理不了跨域跳转(和之前 CSV 发布链接的 307 问题同源)。
  // 用 <script> 标签加载 + callback 参数绕开这个问题,浏览器对 <script src> 的跨域跳转没有限制。
  // 要求 Apps Script 的 doGet 在检测到 ?callback= 参数时,返回 "callback名(JSON)" 的 JS 而不是纯 JSON。
  var jsonpCounter = 0;

  function jsonpRequest(url, onSuccess, onError, timeoutMs) {
    jsonpCounter += 1;
    var cbName = "vocabJsonpCb" + jsonpCounter;
    var script = document.createElement("script");
    var done = false;
    var timer = null;

    function cleanup() {
      if (timer) { clearTimeout(timer); timer = null; }
      try { window[cbName] = null; delete window[cbName]; } catch (e) {}
      if (script.parentNode) { script.parentNode.removeChild(script); }
    }

    window[cbName] = function (data) {
      if (done) { return; }
      done = true;
      cleanup();
      onSuccess(data);
    };

    script.onerror = function () {
      if (done) { return; }
      done = true;
      cleanup();
      onError();
    };

    timer = setTimeout(function () {
      if (done) { return; }
      done = true;
      cleanup();
      onError();
    }, timeoutMs || 8000);

    script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cbName;
    document.getElementsByTagName("head")[0].appendChild(script);
  }

  // 生词本 CSV 列的固定顺序:单词、假名、词性、我的记忆法、中文释义、日文例句、例句中文翻译、JLPT考点、来源类目、加入时间
  var NOTEBOOK_CSV_FIELDS = ["word", "kana", "pos", "mnemonic", "meaning_cn", "example_jp", "example_cn", "jlpt_point", "source_category", "added_at"];

  // ==== 状态 ====
  var currentView = "category"; // "category" | "notebook"
  var currentCategoryName = null;
  var deck = [];
  var categoryCache = {}; // 类目名 -> 已经 fetch 好的词条数组,同一次会话内避免重复请求
  var categoryLoadState = "loading"; // idle | loading | loaded | error(当前打开类目的词条加载状态)
  var categoryRequestToken = 0;
  var categoryList = []; // 从 Apps Script ?action=categories 拿到的类目名数组
  var categoryListState = "loading"; // loading | loaded | error(侧边栏类目列表本身的加载状态)
  var notebookDeck = [];
  var notebookLoadState = "idle"; // idle | loading | loaded | error
  var notebookRequestToken = 0;
  var currentIndex = 0;
  var autoPlayTimer = null;
  var statusTimer = null;

  // ==== 初始化 ====
  function init() {
    buildPanel();
    currentView = "category";
    currentCategoryName = null;
    updateTopBarForView();
    renderCurrent();
    loadCategoryList();
    retryPendingSync();
  }

  function loadCategoryList() {
    categoryListState = "loading";
    jsonpRequest(
      NOTEBOOK_WRITE_URL + "?action=categories",
      function (obj) {
        categoryList = (obj && obj.categories) ? obj.categories : [];
        categoryListState = "loaded";
        onCategoryListLoaded();
      },
      function () {
        categoryListState = "error";
        onCategoryListLoaded();
      }
    );
  }

  function onCategoryListLoaded() {
    buildPanel();
    if (categoryListState === "loaded" && categoryList.length > 0) {
      loadCategory(categoryList[0]);
    } else {
      currentView = "category";
      currentCategoryName = null;
      updateTopBarForView();
      renderCurrent();
    }
  }

  function buildPanel() {
    var panelList = document.getElementById("panelList");
    panelList.innerHTML = "";

    var nbBtn = document.createElement("button");
    nbBtn.className = "panel-item panel-notebook-entry";
    nbBtn.textContent = "生词本";
    nbBtn.onclick = function () { selectNotebook(); };
    panelList.appendChild(nbBtn);

    if (categoryListState === "loading") {
      var loadingDiv = document.createElement("div");
      loadingDiv.className = "loading-state";
      loadingDiv.textContent = "加载中...";
      panelList.appendChild(loadingDiv);
      return;
    }

    if (categoryListState === "error") {
      var errDiv = document.createElement("div");
      errDiv.className = "empty-state";
      errDiv.textContent = "类目加载失败,请检查网络";
      panelList.appendChild(errDiv);
      return;
    }

    for (var i = 0; i < categoryList.length; i++) {
      var catName = categoryList[i];
      var btn = document.createElement("button");
      btn.className = "panel-item";
      btn.textContent = catName;
      btn.setAttribute("data-cat", catName);
      btn.onclick = (function (name) {
        return function () { selectCategory(name); };
      })(catName);
      panelList.appendChild(btn);
    }
  }

  function openPanel() {
    document.getElementById("sidePanel").style.display = "block";
    document.getElementById("clickCatcher").style.display = "block";
  }

  function closePanel() {
    document.getElementById("sidePanel").style.display = "none";
    document.getElementById("clickCatcher").style.display = "none";
  }

  function selectCategory(catName) {
    closePanel();
    loadCategory(catName);
  }

  function selectNotebook() {
    closePanel();
    loadNotebookView();
  }

  // ==== 类目视图 ====
  function loadCategory(catName) {
    stopAutoPlayInternal();
    currentView = "category";
    currentCategoryName = catName;
    currentIndex = 0;
    updateTopBarForView();

    if (Object.prototype.hasOwnProperty.call(categoryCache, catName)) {
      deck = categoryCache[catName];
      categoryLoadState = "loaded";
      renderCurrent();
      return;
    }

    categoryLoadState = "loading";
    deck = [];
    renderCurrent();
    fetchCategoryWords(catName);
  }

  function fetchCategoryWords(catName) {
    categoryRequestToken = categoryRequestToken + 1;
    var myToken = categoryRequestToken;
    var url = NOTEBOOK_WRITE_URL + "?action=words&category=" + encodeURIComponent(catName);
    jsonpRequest(
      url,
      function (obj) {
        if (myToken !== categoryRequestToken) { return; }
        categoryCache[catName] = (obj && obj.words) ? obj.words : [];
        deck = categoryCache[catName];
        categoryLoadState = "loaded";
        if (currentView === "category" && currentCategoryName === catName) {
          currentIndex = 0;
          renderCurrent();
        }
      },
      function () {
        if (myToken !== categoryRequestToken) { return; }
        categoryLoadState = "error";
        if (currentView === "category" && currentCategoryName === catName) { renderCurrent(); }
      }
    );
  }

  // ==== 生词本视图 ====
  function loadNotebookView() {
    stopAutoPlayInternal();
    currentView = "notebook";
    currentIndex = 0;
    updateTopBarForView();
    notebookLoadState = "loading";
    renderCurrent();
    fetchNotebookCsv();
  }

  function fetchNotebookCsv() {
    notebookRequestToken = notebookRequestToken + 1;
    var myToken = notebookRequestToken;
    var xhr = new XMLHttpRequest();
    try {
      xhr.open("GET", NOTEBOOK_READ_CSV_URL, true);
      xhr.timeout = 8000;
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (myToken !== notebookRequestToken) { return; }
          if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
            notebookDeck = parseCsvToWords(xhr.responseText, NOTEBOOK_CSV_FIELDS);
            notebookLoadState = "loaded";
          } else {
            notebookLoadState = "error";
          }
          if (currentView === "notebook") {
            currentIndex = 0;
            renderCurrent();
          }
        }
      };
      xhr.onerror = function () {
        if (myToken !== notebookRequestToken) { return; }
        notebookLoadState = "error";
        if (currentView === "notebook") { renderCurrent(); }
      };
      xhr.ontimeout = function () {
        if (myToken !== notebookRequestToken) { return; }
        notebookLoadState = "error";
        if (currentView === "notebook") { renderCurrent(); }
      };
      xhr.send();
    } catch (e) {
      notebookLoadState = "error";
      renderCurrent();
    }
  }

  // 极简 CSV 解析器,处理逗号分隔和引号转义
  function parseCsv(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    var i = 0;
    var len = text.length;
    while (i < len) {
      var c = text.charAt(i);
      if (inQuotes) {
        if (c === '"') {
          if (text.charAt(i + 1) === '"') {
            field += '"';
            i += 2;
          } else {
            inQuotes = false;
            i += 1;
          }
        } else {
          field += c;
          i += 1;
        }
      } else {
        if (c === '"') {
          inQuotes = true;
          i += 1;
        } else if (c === ',') {
          row.push(field);
          field = "";
          i += 1;
        } else if (c === '\r') {
          i += 1;
        } else if (c === '\n') {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
          i += 1;
        } else {
          field += c;
          i += 1;
        }
      }
    }
    row.push(field);
    rows.push(row);
    return rows;
  }

  // 通用 CSV -> 词条对象数组:按传入的 fields 固定列顺序位置映射,不依赖表头文字。
  // 类目视图和生词本视图共用这一个函数,分别传各自的字段顺序数组。
  function parseCsvToWords(text, fields) {
    var rows = parseCsv(text);
    if (rows.length === 0) { return []; }
    var result = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      if (r.length === 1 && r[0] === "") { continue; }
      var obj = {};
      for (var j = 0; j < fields.length; j++) {
        obj[fields[j]] = r[j] !== undefined ? r[j] : "";
      }
      result.push(obj);
    }
    return result;
  }

  // ==== 顶部栏更新 ====
  // actionBtn 现在挂在单词行右上角,是随 renderCurrent 动态创建的,这里先记下应显示的文字,
  // 等 buildWordRow 创建按钮时再取用;如果按钮当前已存在(比如切换生词本/类目时)也顺手同步一下。
  var currentActionLabel = "+";

  function updateTopBarForView() {
    var titleEl = document.getElementById("categoryTitle");
    if (currentView === "category") {
      titleEl.textContent = currentCategoryName || "";
      currentActionLabel = "+";
    } else {
      titleEl.textContent = "生词本";
      currentActionLabel = "−";
    }
    var actionBtn = document.getElementById("actionBtn");
    if (actionBtn) { actionBtn.textContent = currentActionLabel; }
  }

  function getCurrentDeck() {
    return currentView === "category" ? deck : notebookDeck;
  }

  // ==== 渲染当前词 ====
  function renderCurrent() {
    window.scrollTo(0, 0);

    var progressEl = document.getElementById("progressLabel");
    var wrap = document.getElementById("contentWrap");

    if (currentView === "category" && currentCategoryName === null) {
      progressEl.textContent = "";
      wrap.innerHTML = "";
      var catListDiv = document.createElement("div");
      if (categoryListState === "error") {
        catListDiv.className = "empty-state";
        catListDiv.textContent = "类目加载失败,请检查网络";
      } else if (categoryListState === "loaded") {
        catListDiv.className = "empty-state";
        catListDiv.textContent = "暂无类目";
      } else {
        catListDiv.className = "loading-state";
        catListDiv.textContent = "加载中...";
      }
      wrap.appendChild(catListDiv);
      return;
    }

    if (currentView === "category" && categoryLoadState === "loading") {
      progressEl.textContent = "";
      wrap.innerHTML = "";
      var catLoadingDiv = document.createElement("div");
      catLoadingDiv.className = "loading-state";
      catLoadingDiv.textContent = "加载中...";
      wrap.appendChild(catLoadingDiv);
      return;
    }

    if (currentView === "category" && categoryLoadState === "error") {
      progressEl.textContent = "";
      wrap.innerHTML = "";
      var catErrDiv = document.createElement("div");
      catErrDiv.className = "empty-state";
      catErrDiv.textContent = "该类目加载失败,请检查网络";
      wrap.appendChild(catErrDiv);
      return;
    }

    if (currentView === "notebook" && notebookLoadState === "loading") {
      progressEl.textContent = "";
      wrap.innerHTML = "";
      var loadingDiv = document.createElement("div");
      loadingDiv.className = "loading-state";
      loadingDiv.textContent = "加载中...";
      wrap.appendChild(loadingDiv);
      return;
    }

    if (currentView === "notebook" && notebookLoadState === "error") {
      progressEl.textContent = "";
      wrap.innerHTML = "";
      var errDiv = document.createElement("div");
      errDiv.className = "empty-state";
      errDiv.textContent = "生词本加载失败,请检查网络";
      wrap.appendChild(errDiv);
      return;
    }

    var list = getCurrentDeck();

    if (list.length === 0) {
      progressEl.textContent = "";
      wrap.innerHTML = "";
      var emptyDiv = document.createElement("div");
      emptyDiv.className = "empty-state";
      emptyDiv.textContent = currentView === "notebook" ? "生词本是空的" : "该类目暂无词条";
      wrap.appendChild(emptyDiv);
      return;
    }

    if (currentIndex >= list.length) { currentIndex = list.length - 1; }
    if (currentIndex < 0) { currentIndex = 0; }

    var item = list[currentIndex];
    progressEl.textContent = (currentIndex + 1) + " / " + list.length;

    wrap.innerHTML = "";
    wrap.appendChild(buildWordRow(item.word, item.kana));
    wrap.appendChild(buildTextEl(item.pos, "word-pos"));
    wrap.appendChild(buildDivider());

    appendFieldBlock(wrap, "我的记忆法", item.mnemonic);
    appendFieldBlock(wrap, "中文释义", item.meaning_cn);
    appendFieldBlock(wrap, "考点", item.jlpt_point);
    appendFieldBlock(wrap, "例句(日)", item.example_jp);
    appendFieldBlock(wrap, "例句(中)", item.example_cn);
  }

  function buildTextEl(text, cls) {
    var div = document.createElement("div");
    div.className = cls;
    div.textContent = text || "";
    return div;
  }

  // 单词这一行:前へ/次へ 分别浮动在左右两侧,汉字和假名读音合并在同一行居中显示,
  // +/− 按钮挂在假名读音的右上角(黑底白字圆形),随假名位置一起移动。
  function buildWordRow(wordText, kanaText) {
    var row = document.createElement("div");
    row.className = "word-row";

    var prevBtn = document.createElement("button");
    prevBtn.id = "prevBtnTop";
    prevBtn.className = "nav-btn-inline";
    prevBtn.textContent = "前へ";
    prevBtn.onclick = handlePrev;
    row.appendChild(prevBtn);

    var nextBtn = document.createElement("button");
    nextBtn.id = "nextBtnTop";
    nextBtn.className = "nav-btn-inline";
    nextBtn.textContent = "次へ";
    nextBtn.onclick = handleNext;
    row.appendChild(nextBtn);

    var wordLine = document.createElement("div");
    wordLine.className = "word-line";

    var wordEl = document.createElement("span");
    wordEl.className = "word-main";
    wordEl.textContent = wordText || "";
    wordLine.appendChild(wordEl);

    var kanaWrap = document.createElement("span");
    kanaWrap.className = "word-kana-wrap";

    var kanaEl = document.createElement("span");
    kanaEl.className = "word-kana-inline";
    kanaEl.textContent = kanaText || "";
    kanaWrap.appendChild(kanaEl);

    var actionBtn = document.createElement("button");
    actionBtn.id = "actionBtn";
    actionBtn.className = "corner-action-btn";
    actionBtn.textContent = currentActionLabel;
    actionBtn.onclick = onActionBtnClick;
    kanaWrap.appendChild(actionBtn);

    wordLine.appendChild(kanaWrap);
    row.appendChild(wordLine);

    return row;
  }

  function buildDivider() {
    var div = document.createElement("div");
    div.className = "divider";
    return div;
  }

  function appendFieldBlock(wrap, label, value) {
    if (value === undefined || value === null || value === "") { return; }
    var block = document.createElement("div");
    block.className = "field-block";
    var labelEl = document.createElement("span");
    labelEl.className = "field-label";
    labelEl.textContent = label;
    var valueEl = document.createElement("span");
    valueEl.className = "field-value";
    valueEl.textContent = value;
    block.appendChild(labelEl);
    block.appendChild(valueEl);
    wrap.appendChild(block);
  }

  // ==== 黑屏硬切换 ====
  function withBlackout(updateFn) {
    var blackout = document.getElementById("blackout");
    blackout.style.display = "block";
    setTimeout(function () {
      updateFn();
      blackout.style.display = "none";
    }, 200);
  }

  function handleNext() {
    var list = getCurrentDeck();
    if (list.length === 0) { return; }
    withBlackout(function () {
      currentIndex = (currentIndex + 1) % list.length;
      renderCurrent();
    });
  }

  function handlePrev() {
    var list = getCurrentDeck();
    if (list.length === 0) { return; }
    withBlackout(function () {
      currentIndex = (currentIndex - 1 + list.length) % list.length;
      renderCurrent();
    });
  }

  function handleShuffle() {
    var list = getCurrentDeck();
    if (list.length === 0) { return; }
    withBlackout(function () {
      fisherYatesShuffle(list);
      currentIndex = 0;
      renderCurrent();
    });
  }

  function fisherYatesShuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
  }

  // ==== 自动播放 ====
  function startAutoPlay() {
    if (autoPlayTimer) { return; }
    var input = document.getElementById("intervalInput");
    var seconds = parseFloat(input.value);
    if (!seconds || seconds < 1) { seconds = 5; }
    autoPlayTimer = setInterval(function () {
      var list = getCurrentDeck();
      if (list.length === 0) { return; }
      withBlackout(function () {
        currentIndex = (currentIndex + 1) % list.length;
        renderCurrent();
      });
    }, seconds * 1000);
    document.getElementById("playBtn").disabled = true;
    document.getElementById("playBtn").classList.add("active");
    document.getElementById("pauseBtn").disabled = false;
  }

  function pauseAutoPlay() {
    stopAutoPlayInternal();
  }

  function stopAutoPlayInternal() {
    if (autoPlayTimer) {
      clearInterval(autoPlayTimer);
      autoPlayTimer = null;
    }
    document.getElementById("playBtn").disabled = false;
    document.getElementById("playBtn").classList.remove("active");
    document.getElementById("pauseBtn").disabled = true;
  }

  // ==== 状态提示 ====
  function showStatus(msg) {
    var el = document.getElementById("statusMsg");
    el.textContent = msg;
    if (statusTimer) { clearTimeout(statusTimer); }
    if (msg) {
      statusTimer = setTimeout(function () { el.textContent = ""; }, 2500);
    }
  }

  // ==== 顶部 +/- 按钮 ====
  function onActionBtnClick() {
    if (currentView === "category") {
      addToNotebook();
    } else {
      removeFromNotebookCurrent();
    }
  }

  function addToNotebook() {
    if (deck.length === 0) { return; }
    var item = deck[currentIndex];
    var payloadWord = {
      word: item.word,
      kana: item.kana,
      pos: item.pos,
      mnemonic: item.mnemonic || "",
      meaning_cn: item.meaning_cn,
      example_jp: item.example_jp,
      example_cn: item.example_cn,
      jlpt_point: item.jlpt_point || "",
      source_category: currentCategoryName
    };
    showStatus("已添加");
    sendNotebookRequest("add", payloadWord);
  }

  function removeFromNotebookCurrent() {
    if (notebookDeck.length === 0) { return; }
    var item = notebookDeck[currentIndex];
    var wordName = item.word;
    showStatus("已移除");
    notebookDeck.splice(currentIndex, 1);
    if (currentIndex >= notebookDeck.length) { currentIndex = 0; }
    renderCurrent();
    sendNotebookRequest("remove", { word: wordName });
  }

  // ==== 云端写入(带失败兜底队列) ====
  function sendNotebookRequest(action, wordPayload) {
    var body = JSON.stringify({
      secret: NOTEBOOK_SECRET,
      action: action,
      word: wordPayload
    });
    try {
      var xhr = new XMLHttpRequest();
      xhr.open("POST", NOTEBOOK_WRITE_URL, true);
      xhr.setRequestHeader("Content-Type", "text/plain;charset=utf-8");
      xhr.timeout = 8000;
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status < 200 || xhr.status >= 300) {
            queuePendingSync(action, wordPayload);
            return;
          }
          if (!isSuccessResponseBody(xhr.responseText)) {
            queuePendingSync(action, wordPayload);
          }
        }
      };
      xhr.onerror = function () {
        queuePendingSync(action, wordPayload);
      };
      xhr.ontimeout = function () {
        queuePendingSync(action, wordPayload);
      };
      xhr.send(body);
    } catch (e) {
      queuePendingSync(action, wordPayload);
    }
  }

  // HTTP 状态是 2xx 时,仍需看响应体判断 Apps Script 端是否真的成功
  // 已确认的实际响应格式:{"status":"added"} / {"status":"already_exists"} 为成功,{"error":"unauthorized"} 为失败
  function isSuccessResponseBody(text) {
    if (!text) { return true; }
    try {
      var obj = JSON.parse(text);
      if (obj && obj.success === false) { return false; }
      if (obj && obj.ok === false) { return false; }
      if (obj && obj.error) { return false; }
      return true;
    } catch (e) {
      if (/unauthorized|error|fail/i.test(text)) { return false; }
      return true;
    }
  }

  function getPendingQueue() {
    try {
      var raw = localStorage.getItem(PENDING_QUEUE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function queuePendingSync(action, wordPayload) {
    var queue = getPendingQueue();
    queue.push({ action: action, word: wordPayload });
    try {
      localStorage.setItem(PENDING_QUEUE_KEY, JSON.stringify(queue));
    } catch (e) {}
  }

  function retryPendingSync() {
    var queue = getPendingQueue();
    if (queue.length === 0) { return; }
    try { localStorage.removeItem(PENDING_QUEUE_KEY); } catch (e) {}
    for (var i = 0; i < queue.length; i++) {
      sendNotebookRequest(queue[i].action, queue[i].word);
    }
  }

  init();
</script>
</body>
